// Sync task for standard runs (Client/Server)
tasks.register('syncRunMods', Sync) {
	group = "fabric"
	description = "Syncs local mods to the run/mods directory"

	from("local-mods/${activeVersion}")
	into("run/mods")
}

tasks.named('runClient').configure {
	dependsOn('syncRunMods')
}

tasks.named('runServer').configure {
	dependsOn('syncRunMods')
}